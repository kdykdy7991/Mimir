# SKDY RAG Server — 可选容器部署（后端 Web API）
#
# 启动：  docker compose up -d
# 停止：  docker compose down
#
# 说明：
# - network_mode: host 让容器内 localhost:8003 / :8000 直达宿主机上的
#   embedding / LLM vLLM 服务（与 config/settings.yaml 的本地默认一致）。
# - data/ 通过 volume 持久化（uploads / db / images / traces）。
# - 前端 Next.js 默认本地 `npm run dev` 运行；如需容器化前端可再扩一个 service。
# - 远程 / 多机部署：请先改 config/settings.yaml 的 embedding/llm base_url
#   指向可达服务，再置于反向代理之后（见 README「容器部署」）。
# - **必须单 worker**：BM25 写锁是进程内的，多 worker 共享 data/ 会并发
#   竞争索引。本镜像 CMD 即单进程（uvicorn 默认 workers=1）；不要用
#   `--workers N`（N>1）启动，直到引入跨进程锁（见 README「并发与部署」）。

services:
  # DocReader 解析服务（WeKnora 迁移）。config/settings.yaml 的
  # document_parser.backend 默认已是 docreader，故本服务默认随 compose 启动并
  # 作为 api 的依赖。若显式回滚到 legacy（DOCUMENT_PARSER_BACKEND=legacy 或改
  # yaml），可停用本服务： docker compose up -d --scale docreader=0
  docreader:
    build:
      context: ./services/docreader
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: skdy-docreader:local
    container_name: skdy-docreader
    ports:
      # 宿主机使用 50052，避免与 WeKnora DocReader 的 50051 冲突；
      # 容器内部仍监听标准端口 50051。
      - "50052:50051"
    restart: unless-stopped
    # Container-level startup gate: channel READY + ListEngines + builtin
    # minimum-format check (defined via the Dockerfile HEALTHCHECK). k8s/compose
    # will only consider the container healthy once the probe passes, and
    # ``api`` below starts only after docreader is healthy.
    healthcheck:
      test: ["CMD", "python", "-m", "docreader.health_check"]
      interval: 30s
      timeout: 20s
      start_period: 20s
      retries: 3

  api:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: skdy-rag-server:local
    container_name: skdy-rag-api
    network_mode: host
    depends_on:
      docreader:
        condition: service_healthy
    environment:
      MCP_INTERNAL_API_KEY: "${MCP_INTERNAL_API_KEY:-}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Standalone read-only MCP runtime (plan Phase 4 §P4.4).
  # - No heavy RAG deps (see deploy/mcp/Dockerfile) and NO data mount:
  #   it only calls the main service's internal read-only HTTP API.
  # - `rag_client_backend: http` is the explicit, non-fallback backend.
  # - HEALTHCHECK fails until the main API is reachable, so MCP never
  #   serves from a down upstream.
  mcp:
    build:
      context: .
      dockerfile: deploy/mcp/Dockerfile
    image: skdy-mcp:local
    container_name: skdy-mcp
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      MCP_INTERNAL_API_KEY: "${MCP_INTERNAL_API_KEY:-}"
    healthcheck:
      test: ["CMD", "./health_check.sh", "--base-url", "http://127.0.0.1:8766"]
      interval: 30s
      timeout: 20s
      start_period: 20s
      retries: 3
    restart: unless-stopped
