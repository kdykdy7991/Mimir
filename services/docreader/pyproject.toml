[project]
name = "skdy-docreader"
version = "0.1.0"
description = "Local document parsing service (WeKnora DocReader migration) — standalone gRPC service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.78.0",
    "grpcio-health-checking>=1.78.0",
    "grpcio-tools>=1.78.0",
    "protobuf>=6.26.0",
    # PDF backend (builtin engine): layout-aware text + scanned-page rendering.
    # Required at container runtime so the builtin PDF parser actually works
    # inside the image (not just under the dev venv).
    "pymupdf>=1.24.0",
    # Image formats (builtin engine): magic/decodability validation for the
    # Phase-6 image parser.
    "pillow>=10.0.0",
]

# DOCX/XLSX/PPTX/EPUB/XMind are parsed from OOXML zip members + standard-library
# xml.etree, so they need no extra deps beyond the above. legacy DOC/XLS/PPT
# (OLE2) remain GATED placeholders — a converter (e.g. LibreOffice) must be
# installed at deployment before they are enabled. openpyxl / python-docx /
# opendataloader-pdf are intentionally NOT declared here (offline scope keeps
# this image lean); see ../provenance and
# docs/plan-2026-09-09-weknora-local-document-parser-migration.md §7.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["docreader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"